# The agent API behind a TLS reverse proxy, with metrics, alerts, dashboards and logs.
#
#   cp .env.example .env                       # then fill it in
#   python -c "import secrets; print(secrets.token_urlsafe(32))" > secrets/agi_api_token.txt
#   put fullchain.pem and privkey.pem in monitoring/nginx/ssl/
#   docker compose up -d --build
#
# Only the proxy (80, 443) is published. Grafana is at /grafana/ behind the proxy.

services:
  api:
    build: .
    restart: unless-stopped
    command: ["serve", "--config", "config/docker.toml", "--model", "${AGI_MODEL:?set AGI_MODEL in .env}"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    secrets:
      - agi_api_token
    volumes:
      - agi-data:/data
    expose:
      - "8000"
    labels:
      logging: "promtail"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./monitoring/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./monitoring/nginx/ssl:/etc/nginx/ssl:ro
    labels:
      logging: "promtail"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    secrets:
      - agi_api_token
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro

  loki:
    image: grafana/loki:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./monitoring/loki:/etc/loki:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.2.1
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./monitoring/promtail:/etc/promtail:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

secrets:
  agi_api_token:
    file: ./secrets/agi_api_token.txt

volumes:
  agi-data:
  prometheus-data:
  loki-data:
  grafana-data:
