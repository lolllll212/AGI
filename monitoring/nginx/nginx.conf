# TLS in front of the agent API. Certificates: monitoring/nginx/ssl/{fullchain,privkey}.pem

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # One client address may open this many requests per second (the API also limits per token).
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;          # the API refuses larger bodies anyway

    # Metrics are for Prometheus on the internal network, not for the internet.
    location = /metrics {
      return 404;
    }

    location /grafana/ {
      proxy_pass http://grafana:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    location / {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 320s;        # a task may take up to 300 s
      proxy_send_timeout 60s;
    }
  }
}
