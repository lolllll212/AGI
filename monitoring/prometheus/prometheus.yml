global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: agi
    metrics_path: /metrics
    # /metrics sits behind the same bearer token as the rest of the API.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/agi_api_token
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
