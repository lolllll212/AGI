server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Containers that carry the label logging=promtail (the api and the proxy).
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
    pipeline_stages:
      # The API writes one JSON object per request; lift the low-cardinality fields into labels.
      - match:
          selector: '{service="api"}'
          stages:
            - json:
                expressions:
                  level: level
                  event: event
                  status: status
                  route: route
                  ts: ts
            - labels:
                level:
                event:
            - timestamp:
                source: ts
                format: RFC3339Nano
