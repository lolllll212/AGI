[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-toolkit"
version = "0.2.0"
description = "Building blocks for more capable, more trustworthy AI agents: a tool-using ReAct loop, episodic memory, verified reasoning, trained search, grounded world models and safe multi-agent self-improvement."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["conflux-state>=0.9.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
agi-demo = "agi.__main__:main"

[tool.setuptools.packages.find]
include = ["agi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
